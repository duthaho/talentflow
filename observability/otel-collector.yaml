extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/redact_calendar_feed_tokens:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.path"], "^/v1/calendar-feeds/[^/]+\\.ics$", "/v1/calendar-feeds/{token}.ics")
          - replace_pattern(attributes["http.target"], "/v1/calendar-feeds/[^/?]+\\.ics", "/v1/calendar-feeds/{token}.ics")
          - replace_pattern(attributes["http.url"], "/v1/calendar-feeds/[^/?]+\\.ics", "/v1/calendar-feeds/{token}.ics")
          - replace_pattern(attributes["url.full"], "/v1/calendar-feeds/[^/?]+\\.ics", "/v1/calendar-feeds/{token}.ics")
  batch:

exporters:
  debug:
    verbosity: basic
  otlphttp/grafana:
    endpoint: http://grafana:4318

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact_calendar_feed_tokens, batch]
      exporters: [debug, otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/grafana]
