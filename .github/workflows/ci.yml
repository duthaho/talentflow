name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hiring-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: hiring-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      POSTGRES_PORT: 25432
      MAILPIT_PORT: 28025
      KEYCLOAK_PORT: 28081
      SEAWEEDFS_PORT: 28333
      OTEL_GRPC_PORT: 24317
      OTEL_METRICS_PORT: 28888
      GRAFANA_PORT: 23001
      API_PORT: 28000
      WEB_PORT: 23000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start the real hiring stack, including the email worker
        run: |
          docker compose up --detach --build --wait api web notification-worker
          make seed
      - name: Run hiring and stale-version browser scenarios
        run: npm run test:e2e
        working-directory: web
      - name: Collect compose diagnostics
        if: failure()
        run: |
          mkdir -p web/test-results
          docker compose --profile workers ps --all > web/test-results/compose-status.txt
          docker compose --profile workers logs --no-color > web/test-results/compose.log
      - name: Upload failure traces, screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hiring-e2e-failure
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop this job's stack
        if: always()
        run: docker compose --profile workers down --volumes

  event-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the AsyncAPI event contract (ADR 006)
        env:
          ASYNCAPI_TELEMETRY: 'false'
        run: npx --yes @asyncapi/cli@6.3.1 validate docs/events/asyncapi.yaml

  quality-and-migrations:
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:4.1.8-management
        env:
          RABBITMQ_DEFAULT_USER: talentflow
          RABBITMQ_DEFAULT_PASS: talentflow
          RABBITMQ_DEFAULT_VHOST: /talentflow
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_DB: talentflow
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentflow -d talentflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.12.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DUTH59_TEST_POSTGRES_URL: postgresql+psycopg://talentflow:ci-password@localhost:5432/talentflow
      DUTH59_TEST_RABBITMQ_URL: amqp://talentflow:talentflow@localhost:5672/%2Ftalentflow
      DATABASE_URL: postgresql+psycopg://talentflow:ci-password@localhost:5432/talentflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run python -m pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-groups --frozen
        working-directory: .
      - run: npm ci
      - name: Fail when the generated API client is stale
        run: |
          make -C .. api-client
          git diff --exit-code -- openapi.json src/lib/api/schema.ts \
            || { echo 'Run `make api-client` and commit the result.' >&2; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  container-smoke:
    needs: quality-and-migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_DB: talentflow
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentflow -d talentflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.12.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: production
      AUTH_MODE: oidc_jwt
      DATABASE_URL: postgresql+psycopg://talentflow:ci-password@host.docker.internal:5432/talentflow
      CORS_ALLOWED_ORIGINS: https://console.example.test
      OIDC_ISSUER: https://issuer.example.test
      OIDC_AUDIENCE: talentflow-api
      OIDC_JWKS_URL: https://issuer.example.test/.well-known/jwks.json
      REDIS_URL: redis://host.docker.internal:6379/0
      ATTACHMENT_STORAGE_ROOT: /var/lib/talentflow/attachments
      ATTACHMENT_SCAN_MODE: clamav
      CALENDAR_PUBLIC_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: docker build --tag talentflow:${{ github.sha }} .
      - name: Apply migrations in the image
        run: >-
          docker run --rm --add-host host.docker.internal:host-gateway
          --env APP_ENV --env AUTH_MODE --env DATABASE_URL --env CORS_ALLOWED_ORIGINS
          --env OIDC_ISSUER --env OIDC_AUDIENCE --env OIDC_JWKS_URL --env REDIS_URL
          --env ATTACHMENT_STORAGE_ROOT --env ATTACHMENT_SCAN_MODE --env CALENDAR_PUBLIC_BASE_URL
          talentflow:${{ github.sha }} uv run alembic upgrade head
      - name: Run API and verify liveness/readiness
        run: |
          docker run --detach --rm --name talentflow-api --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:8000:8000 \
            --env APP_ENV --env AUTH_MODE --env DATABASE_URL --env CORS_ALLOWED_ORIGINS \
            --env OIDC_ISSUER --env OIDC_AUDIENCE --env OIDC_JWKS_URL --env REDIS_URL \
            --env ATTACHMENT_STORAGE_ROOT --env ATTACHMENT_SCAN_MODE --env CALENDAR_PUBLIC_BASE_URL \
            talentflow:${{ github.sha }}
          trap 'docker logs talentflow-api; docker stop talentflow-api' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/health/ready && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/metrics | grep -q talentflow_http_requests_total
      - name: Run bounded outbox-worker smoke command
        run: >-
          docker run --rm --add-host host.docker.internal:host-gateway
          --env WORKER_RUN_ONCE=1
          --env APP_ENV --env AUTH_MODE --env DATABASE_URL --env CORS_ALLOWED_ORIGINS
          --env OIDC_ISSUER --env OIDC_AUDIENCE --env OIDC_JWKS_URL --env REDIS_URL
          --env ATTACHMENT_STORAGE_ROOT --env ATTACHMENT_SCAN_MODE --env CALENDAR_PUBLIC_BASE_URL
          talentflow:${{ github.sha }} uv run python -m app.modules.notifications.application.run_outbox_publisher

  compose-oidc-smoke:
    needs: quality-and-migrations
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            postgres_port: 5432
            mailpit_port: 8025
            keycloak_port: 8081
            seaweedfs_port: 8333
            otel_grpc_port: 4317
            otel_metrics_port: 8888
            grafana_port: 3001
            api_port: 8000
            web_port: 3000
          - name: non-default-host-ports
            postgres_port: 15432
            mailpit_port: 18025
            keycloak_port: 18081
            seaweedfs_port: 18333
            otel_grpc_port: 14317
            otel_metrics_port: 18888
            grafana_port: 13001
            api_port: 18000
            web_port: 13000
    env:
      POSTGRES_PORT: ${{ matrix.postgres_port }}
      MAILPIT_PORT: ${{ matrix.mailpit_port }}
      KEYCLOAK_PORT: ${{ matrix.keycloak_port }}
      SEAWEEDFS_PORT: ${{ matrix.seaweedfs_port }}
      OTEL_GRPC_PORT: ${{ matrix.otel_grpc_port }}
      OTEL_METRICS_PORT: ${{ matrix.otel_metrics_port }}
      GRAFANA_PORT: ${{ matrix.grafana_port }}
      API_PORT: ${{ matrix.api_port }}
      WEB_PORT: ${{ matrix.web_port }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the local OIDC stack and seed demo data
        run: |
          docker compose up --detach --build --wait
          make seed
          make seed
      - name: Obtain all demo tokens and verify API authorization
        run: |
          get_token() {
            curl --fail --silent --show-error \
              --data 'grant_type=password' --data 'client_id=talentflow-dev-cli' \
              --data "username=$1" --data 'password=dev-demo-password' \
              "http://localhost:${KEYCLOAK_PORT}/realms/talentflow/protocol/openid-connect/token" \
              | python -c 'import json, sys; print(json.load(sys.stdin)["access_token"])'
          }
          assert_status() {
            expected=$1
            token=$2
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" "http://localhost:${API_PORT}/v1/candidate-cases")
            test "$actual" = "$expected"
          }
          assert_status 200 "$(get_token admin@talentflow.local)"
          assert_status 200 "$(get_token recruiter@talentflow.local)"
          assert_status 200 "$(get_token manager@talentflow.local)"
          assert_status 403 "$(get_token interviewer@talentflow.local)"
      - name: Verify the web app starts a PKCE login against Keycloak
        run: |
          location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://localhost:${WEB_PORT}/auth/login")
          echo "$location" | grep -q "^http://localhost:${KEYCLOAK_PORT}/realms/talentflow/protocol/openid-connect/auth?"
          echo "$location" | grep -q 'code_challenge_method=S256'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:${WEB_PORT}/signed-out")" = 200
      - name: Verify the Collector received an API trace
        run: |
          curl --fail --silent --show-error "http://localhost:${API_PORT}/health/live" >/dev/null
          for attempt in $(seq 1 30); do
            accepted=$(curl --fail --silent "http://localhost:${OTEL_METRICS_PORT}/metrics" \
              | awk '/otelcol_receiver_accepted_spans_total/ && $1 !~ /^#/ { total += $2 } END { print total + 0 }')
            test "$accepted" -gt 0 && exit 0
            sleep 1
          done
          echo 'Collector did not receive a trace' >&2
          exit 1
      - name: Verify Grafana RED dashboard has queryable data
        run: |
          curl --fail --silent "http://localhost:${GRAFANA_PORT}/api/datasources/uid/prometheus" >/dev/null
          for attempt in $(seq 1 30); do
            result=$(curl --fail --silent --get \
              --data-urlencode 'query=sum(rate(http_server_request_duration_seconds_count{service_name="talentflow-api"}[5m])) by (http_route)' \
              "http://localhost:${GRAFANA_PORT}/api/datasources/proxy/uid/prometheus/api/v1/query")
            if echo "$result" | python -c 'import json, sys; assert json.load(sys.stdin)["data"]["result"]'; then
              exit 0
            fi
            sleep 1
          done
          echo 'Grafana Prometheus datasource has no RED data' >&2
          exit 1
      - name: Print compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the local stack
        if: always()
        run: docker compose down --volumes
