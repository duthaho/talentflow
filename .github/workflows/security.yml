name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  dependency-vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Report high and critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-ref: .
          scan-type: fs
          scanners: vuln
          vuln-type: library
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Block critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-ref: .
          scan-type: fs
          scanners: vuln
          vuln-type: library
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  container-vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate image
        run: docker build --tag talentflow:security-scan .
      - name: Report high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: talentflow:security-scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Block critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: talentflow:security-scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
