services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &runtime_environment
      APP_ENV: development
      AUTH_MODE: development_headers
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@postgres:5432/talentflow
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      ATTACHMENT_STORAGE_ROOT: /app/data/attachments
      ATTACHMENT_MAX_BYTES: 5242880
      ATTACHMENT_SCAN_MODE: noop
      CALENDAR_PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *runtime_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - attachment_data:/app/data/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  notification-worker:
    build: .
    command: ["python", "-m", "app.modules.notifications.application.run_outbox_publisher"]
    environment: *runtime_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  attachment_data:
