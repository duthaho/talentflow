services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.12.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      RABBITMQ_DEFAULT_USER: talentflow
      RABBITMQ_DEFAULT_PASS: talentflow
      RABBITMQ_DEFAULT_VHOST: /talentflow
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.28.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-keycloak-admin-password}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-talentflow.json:/opt/keycloak/data/import/realm-talentflow.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      # First-start Quarkus augmentation plus realm import can take several minutes on slow runners.
      start_period: 8m

  seaweedfs:
    image: chrislusf/seaweedfs:3.88
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        sed -e "s#__ACCESS_KEY__#$$SEAWEEDFS_ACCESS_KEY#g"
        -e "s#__SECRET_KEY__#$$SEAWEEDFS_SECRET_KEY#g"
        -e "s#__BOOTSTRAP_ACCESS_KEY__#$$SEAWEEDFS_BOOTSTRAP_ACCESS_KEY#g"
        -e "s#__BOOTSTRAP_SECRET_KEY__#$$SEAWEEDFS_BOOTSTRAP_SECRET_KEY#g"
        /etc/seaweedfs/s3.json.tmpl > /tmp/s3.json &&
        exec weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data -s3 -s3.config=/tmp/s3.json
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-dev-seaweedfs-access-key}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-dev-seaweedfs-secret-key}
      SEAWEEDFS_BOOTSTRAP_ACCESS_KEY: ${SEAWEEDFS_BOOTSTRAP_ACCESS_KEY:-dev-seaweedfs-bootstrap-key}
      SEAWEEDFS_BOOTSTRAP_SECRET_KEY: ${SEAWEEDFS_BOOTSTRAP_SECRET_KEY:-dev-seaweedfs-bootstrap-secret}
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json.tmpl:/etc/seaweedfs/s3.json.tmpl:ro
    ports:
      - "127.0.0.1:${SEAWEEDFS_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/1.1 (200|403)' "]
      interval: 5s
      timeout: 3s
      retries: 30

  seaweedfs-init:
    image: amazon/aws-cli:2.32.4
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_BOOTSTRAP_ACCESS_KEY:-dev-seaweedfs-bootstrap-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_BOOTSTRAP_SECRET_KEY:-dev-seaweedfs-bootstrap-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket talentflow-attachments
        || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket talentflow-attachments
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  clamav:
    image: clamav/clamav-debian:1.4.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_METRICS_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/otel-lgtm:0.11.0
    volumes:
      - ./observability/grafana/provisioning/dashboards/talentflow.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/talentflow.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards/talentflow:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &runtime_environment
      APP_ENV: development
      AUTH_MODE: oidc_jwt
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@postgres:5432/talentflow
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/talentflow
      OIDC_AUDIENCE: talentflow-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/talentflow/protocol/openid-connect/certs
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      ATTACHMENT_STORAGE_ROOT: /app/data/attachments
      ATTACHMENT_STORAGE_BACKEND: s3
      ATTACHMENT_S3_ENDPOINT_URL: http://seaweedfs:8333
      ATTACHMENT_S3_PUBLIC_ENDPOINT_URL: http://localhost:${SEAWEEDFS_PORT:-8333}
      ATTACHMENT_S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-dev-seaweedfs-access-key}
      ATTACHMENT_S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-dev-seaweedfs-secret-key}
      ATTACHMENT_S3_BUCKET: talentflow-attachments
      ATTACHMENT_S3_REGION: us-east-1
      ATTACHMENT_DOWNLOAD_TTL_SECONDS: 300
      ATTACHMENT_MAX_BYTES: 5242880
      ATTACHMENT_SCAN_MODE: clamav
      ATTACHMENT_CLAMAV_HOST: clamav
      ATTACHMENT_CLAMAV_PORT: 3310
      CALENDAR_PUBLIC_BASE_URL: http://localhost:${API_PORT:-8000}
      RABBITMQ_URL: amqp://talentflow:talentflow@rabbitmq:5672/%2Ftalentflow
      NOTIFICATION_EMAIL_ADAPTER: smtp
      NOTIFICATION_FROM_EMAIL: notifications@talentflow.local
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: talentflow-api
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_METRIC_EXPORT_INTERVAL: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *runtime_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: ./web
    environment:
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      API_BASE_URL: http://api:8000
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/talentflow
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/talentflow
      OIDC_CLIENT_ID: talentflow-api
      REDIS_URL: redis://redis:6379/1
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  outbox-relay:
    build: .
    command: ["python", "-m", "app.modules.notifications.application.run_outbox_publisher"]
    environment:
      <<: *runtime_environment
      OTEL_SERVICE_NAME: talentflow-outbox-relay
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  notification-worker:
    build: .
    command: ["python", "-m", "app.modules.notifications.application.run_email_worker"]
    environment:
      <<: *runtime_environment
      OTEL_SERVICE_NAME: talentflow-notification-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  retention-worker:
    build: .
    command: ["python", "-m", "app.workers.retention"]
    environment:
      <<: *runtime_environment
      OTEL_SERVICE_NAME: talentflow-retention-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 35s
    profiles: ["workers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  seed:
    build:
      context: .
      target: seed
    command: ["python", "-m", "scripts.seed_demo"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@postgres:5432/talentflow
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-keycloak-admin-password}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-dev-demo-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

volumes:
  rabbitmq_data:
  postgres_data:
  seaweedfs_data:
