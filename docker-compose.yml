services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@postgres:5432/talentflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
